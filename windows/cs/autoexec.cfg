fps_max 240
voice_threshold "-120"
sensitivity "1"
volume "0.1"

bind x "switchhands"
bind j "sv_rethrow_last_grenade"
bind "MOUSE3" "player_ping"
bind CAPSLOCK noclip
alias add_place_bot "bot_kick; bot_add; bot_stop 1; bot_place"
bind p "add_place_bot"
bind k "ent_fire smokegrenade_projectile kill; ent_fire flashbang_projectile kill; ent_fire hegrenade_projectile kill; ent_fire molotov_projectile kill; ent_fire decoy_projectile kill; ent_fire inferno kill; stopsound"


alias "+flash" "slot7"
alias "-flash" "+lookatweapon; -lookatweapon"

alias "+smoke" "slot8"
alias "-smoke" "+lookatweapon; -lookatweapon"

alias "+molly" "slot10"
alias "-molly" "+lookatweapon; -lookatweapon"

alias "+he" "slot6"
alias "-he" "+lookatweapon; -lookatweapon"

alias "+c4" "slot5"
alias "-c4" "+lookatweapon; -lookatweapon"

bind c "+flash";
bind v "+smoke";
bind "MOUSE5" "+molly";
bind "MOUSE4" "+he";
bind 5 "+c4"

viewmodel_fov "65"
viewmodel_offset_x "2.5"
viewmodel_offset_y "2"
viewmodel_offset_z "-2"
viewmodel_presetpos "0"

r_drawparticles "0"

cl_autohelp "0"

cl_color "3"
cl_crosshair_drawoutline "1"
cl_crosshair_dynamic_maxdist_splitratio "0.35"
cl_crosshair_dynamic_splitalpha_innermod "1"
cl_crosshair_dynamic_splitalpha_outermod "0.5"
cl_crosshair_dynamic_splitdist "7"
cl_crosshair_friendly_warning "0"
cl_crosshair_sniper_width "1"
cl_crosshair_t "0"
cl_crosshaircolor_a "255"
cl_crosshaircolor_b "50"
cl_crosshaircolor_g "250"
cl_crosshaircolor_r "50"
cl_crosshairdot "0"
cl_crosshair_gap "5"
cl_crosshair_length "7"
cl_crosshairstyle "4"
cl_crosshair_thickness "2"

cl_hide_avatar_images "0"
cl_hud_color "9"
cl_hud_radar_scale "1.2"
cl_radar_always_centered "0"
cl_radar_icon_scale_min ".5"
cl_radar_rotate "1"
cl_radar_scale ".4"
cl_radar_square_with_scoreboard "0"

